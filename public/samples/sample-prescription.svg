<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050" style="background:#fafafa; font-family:'Segoe UI', system-ui, sans-serif;">
  <!-- Paper Background & Border -->
  <rect x="20" y="20" width="760" height="1010" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.05))"/>
  
  <!-- Hospital Header Banner -->
  <rect x="20" y="20" width="760" height="140" rx="16" fill="#0f766e"/>
  <rect x="20" y="140" width="760" height="20" fill="#0f766e"/>
  <circle cx="70" cy="80" r="32" fill="#ffffff" opacity="0.15"/>
  <path d="M60 80 H80 M70 70 V90" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  
  <text x="120" y="65" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.5">KING GEORGE'S MEDICAL UNIVERSITY (KGMU)</text>
  <text x="120" y="90" fill="#ccfbf1" font-size="14" font-weight="600">DEPARTMENT OF INTERNAL MEDICINE &amp; CARDIOLOGY, LUCKNOW, U.P.</text>
  <text x="120" y="112" fill="#99f6e4" font-size="12">OPD Room No. 14, Shah Mina Road, Chowk, Lucknow • OPD Reg: KGMU/2026/8941</text>

  <!-- Doctor & Patient Row -->
  <rect x="40" y="175" width="720" height="105" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="202" fill="#0f172a" font-size="16" font-weight="700">Dr. A. K. Srivastava, <tspan font-weight="400" font-size="13" fill="#64748b">MD, DM (Card.) - Reg: UPMC-48291</tspan></text>
  <line x1="60" y1="215" x2="740" y2="215" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="60" y="240" fill="#334155" font-size="13" font-weight="600">Patient: <tspan font-weight="700" fill="#0f172a">Ram Swaroop Shukla</tspan></text>
  <text x="320" y="240" fill="#334155" font-size="13">Age / Sex: <tspan font-weight="700">72 Y / M</tspan></text>
  <text x="480" y="240" fill="#334155" font-size="13">Date: <tspan font-weight="700">20-Nov-2026</tspan></text>
  <text x="60" y="265" fill="#334155" font-size="13">BP: <tspan font-weight="700" fill="#e11d48">148/92 mmHg</tspan></text>
  <text x="240" y="265" fill="#334155" font-size="13">Pulse: <tspan font-weight="700">78 bpm</tspan></text>
  <text x="380" y="265" fill="#334155" font-size="13">Diagnosis: <tspan font-weight="600" fill="#0284c7">Type-2 DM + HTN + Chest Congestion</tspan></text>

  <!-- Rx Symbol -->
  <text x="55" y="340" fill="#0d9488" font-size="44" font-weight="900" font-style="italic">℞</text>
