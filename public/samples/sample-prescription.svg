  <!-- Medicine 1 -->
  <text x="80" y="380" fill="#0f172a" font-size="17" font-weight="700">1. Tab. Augmentin 625 Duo (Amoxycillin + Pot. Clavulanate)</text>
  <text x="100" y="405" fill="#475569" font-size="13" font-family="'Courier New', monospace">1 - 0 - 1  x  5 days  [After food with water]</text>

  <!-- Medicine 2 -->
  <text x="80" y="455" fill="#0f172a" font-size="17" font-weight="700">2. Cap. Pan-D (Pantoprazole 40mg + Domperidone 30mg)</text>
  <text x="100" y="480" fill="#475569" font-size="13" font-family="'Courier New', monospace">1 - 0 - 0  x  7 days  [Empty stomach, 30 min before breakfast]</text>

  <!-- Medicine 3 -->
  <text x="80" y="530" fill="#0f172a" font-size="17" font-weight="700">3. Tab. Dolo 650 (Paracetamol 650mg)</text>
  <text x="100" y="555" fill="#475569" font-size="13" font-family="'Courier New', monospace">1 - 0 - 1 (SOS in fever &gt; 100°F or body pain) x 3 days</text>

  <!-- Medicine 4 -->
  <text x="80" y="605" fill="#0f172a" font-size="17" font-weight="700">4. Tab. Telma 40 (Telmisartan 40mg)</text>
  <text x="100" y="630" fill="#475569" font-size="13" font-family="'Courier New', monospace">0 - 1 - 0  x  30 days  [Daily after lunch, monitor BP]</text>

  <!-- Medicine 5 (Slightly slanted/unclear) -->
  <text x="80" y="680" fill="#0f172a" font-size="17" font-weight="700">5. Tab. Glycomet-GP 2 (Metformin 500mg + Glimepiride 2mg)</text>
  <text x="100" y="705" fill="#475569" font-size="13" font-family="'Courier New', monospace">1 - 0 - 0  x  30 days  [With breakfast, check fasting sugar]</text>

  <!-- Doctor Advice & Stamp Section -->
  <rect x="40" y="760" width="720" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="788" fill="#334155" font-size="13" font-weight="700">Doctor Advice:</text>
  <text x="60" y="812" fill="#475569" font-size="12">• Salt-restricted diabetic diet, warm salt-water gargle 3 times a day.</text>
  <text x="60" y="832" fill="#475569" font-size="12">• Generic substitutes from Jan Aushadhi Kendra permitted (same active salts).</text>
  <text x="60" y="852" fill="#475569" font-size="12">• Review in OPD after 7 days with FBS &amp; PPBS report.</text>

  <!-- Stamp & Signature Simulation -->
  <g transform="translate(540, 775)">
    <rect x="0" y="0" width="180" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="90" y="24" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="700">KGMU OPD MEDICAL UNIT</text>
    <text x="90" y="42" text-anchor="middle" fill="#0369a1" font-size="11">Dr. A. K. Srivastava</text>
    <text x="90" y="58" text-anchor="middle" fill="#0369a1" font-size="10">Reg. No: 48291</text>
    <!-- Stylized handwritten signature in blue -->
    <path d="M-20 85 Q 30 50, 70 80 T 140 70 T 200 85" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Official Footer -->
  <line x1="40" y1="940" x2="760" y2="940" stroke="#cbd5e1"/>
  <text x="400" y="970" text-anchor="middle" fill="#64748b" font-size="12">Emergency Care: Trauma Centre KGMU 24x7 • UP Ambulance Helpline: 108 / 102</text>
  <text x="400" y="990" text-anchor="middle" fill="#94a3b8" font-size="11">DawaaSetu AI Kaushal Hackathon Demo Sample Prescription • Powered by Gemini AI</text>
</svg>
